<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>My Dashboard</h2>

        <ul>
            <li>🏠 Home</li>
            <li>📊 Analytics</li>
            <li>📁 Projects</li>
            <li>📨 Messages</li>
            <li>⚙️ Settings</li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Header -->
        <header class="header">
            <h1>Dashboard Overview</h1>
            <button>Profile</button>
        </header>

        <!-- Cards -->
        <section class="cards">

            <div class="card">
                <h3>Users</h3>
                <p>1,250</p>
            </div>

            <div class="card">
                <h3>Sales</h3>
                <p>$8,900</p>
            </div>

            <div class="card">
                <h3>Orders</h3>
                <p>320</p>
            </div>

            <div class="card">
                <h3>Revenue</h3>
                <p>$15,400</p>
            </div>

        </section>

        <!-- Statistics -->
        <section class="statistics">

            <div class="chart">
                <h2>Monthly Report</h2>
                <img src="Screenshot 2026-11-09 140626.png"
                     alt="Monthly Report"
                     class="report-image">
            </div>

            <div class="tasks">
                <h2>Tasks</h2>
                <ul>
                    <li>✅ Design Homepage</li>
                    <li>✅ Create Database</li>
                    <li>⏳ Dashboard Update</li>
                    <li>📅 Project Meeting</li>
                </ul>
            </div>

        </section>

    </main>

</div>

</body>
</html>
